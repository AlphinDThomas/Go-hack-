<!DOCTYPE html>
<html>
<head>
    <title>Pulse-Guard Enterprise KYC</title>
    <style>
        :root { --neon: #00f2ff; --bg: #0a0e14; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; margin: 0; }
        
        #sidebar { width: 300px; background: #11171f; height: 100vh; border-right: 1px solid #222; padding: 20px; }
        #main { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .status-item { padding: 15px; margin: 10px 0; border-radius: 8px; background: #1a222c; border-left: 4px solid #333; opacity: 0.5; }
        .active { opacity: 1; border-left-color: var(--neon); box-shadow: 0 0 10px rgba(0,242,255,0.2); }
        .verified { border-left-color: #00ff88; opacity: 1; }

        .video-box { position: relative; border: 2px solid #333; border-radius: 20px; overflow: hidden; background: black; }
        .scan-line { position: absolute; width: 100%; height: 2px; background: var(--neon); box-shadow: 0 0 15px var(--neon); top: 0; animation: scan 3s infinite linear; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        button { background: var(--neon); color: black; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
<div id="sidebar">
    <h2>KYC Progress</h2>
    <div id="step-id" class="status-item active">1. ID Verification</div>
    <div id="step-pulse" class="status-item">2. Heartbeat (rPPG)</div>
    <div id="step-gesture" class="status-item">3. Gesture Challenge</div>
    <div id="step-head" class="status-item">4. Spatial Awareness</div>
    
    <div style="margin-top: 50px;">
        <small>SYSTEM STATUS</small>
        <div style="color: #00ff88;">● ENCRYPTED</div>
    </div>
</div>

<div id="main">
    <div class="video-box">
        <div class="scan-line"></div>
        <img src="/video_feed" width="800">
    </div>
    
    <div style="display: flex; gap: 20px; margin-top: 20px;">
        <button id="start-btn" onclick="startKYC()">CONFIRM ID & START BIOMETRICS</button>
        <button id="reset-btn" onclick="resetKYC()" style="display: none; background: #ff3333; color: white;">RESTART SESSION</button>
    </div>
</div>

<script>
    function startKYC() {
        fetch('/next_stage', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            document.getElementById('step-id').className = 'status-item verified';
            document.getElementById('step-pulse').className = 'status-item active';
            document.getElementById('start-btn').style.display = 'none';
        });
    }

    function resetKYC() {
        fetch('/reset', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            // Reset Sidebar UI
            document.querySelectorAll('.status-item').forEach(el => el.className = 'status-item');
            document.getElementById('step-id').className = 'status-item active';
            
            // Toggle Buttons
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('reset-btn').style.display = 'none';
        });
    }

    // Polling function to update UI states
    setInterval(() => {
        fetch('/get_status').then(r => r.json()).then(data => {
            if(data.state === 'GESTURE') {
                document.getElementById('step-pulse').className = 'status-item verified';
                document.getElementById('step-gesture').className = 'status-item active';
            }
            else if(data.state === 'HEAD_POSE') {
                document.getElementById('step-gesture').className = 'status-item verified';
                document.getElementById('step-head').className = 'status-item active';
            }
            else if(data.state === 'SUCCESS' || data.state === 'FAILED') {
                if(data.state === 'SUCCESS') document.getElementById('step-head').className = 'status-item verified';
                
                // Show the Restart Button when the session ends
                document.getElementById('start-btn').style.display = 'none';
                document.getElementById('reset-btn').style.display = 'block';
            }
        });
    }, 1000);
</script>
</body>
</html>
