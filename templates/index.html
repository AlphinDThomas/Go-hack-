<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse-Guard | e-KYC</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #58a6ff;
            font-weight: 300;
            letter-spacing: 4px;
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        .scanner-container {
            position: relative;
            padding: 10px;
            background: #161b22;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.15);
            border: 1px solid #30363d;
        }
        /* A cool scanning line effect over the video */
        .scanner-container::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            height: 2px;
            background: rgba(88, 166, 255, 0.8);
            box-shadow: 0 0 10px #58a6ff;
            animation: scan 3s infinite linear;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: 10px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: calc(100% - 12px); opacity: 0; }
        }
        img {
            border-radius: 8px;
            width: 800px;
            height: 600px;
            object-fit: cover;
            display: block;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #484f58;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pulse-Guard</h1>
        <div class="subtitle">COGNITIVE LIVENESS ENGINE VER 1.0</div>
    </div>

    <div class="scanner-container">
        <!-- This image tag is where the Python OpenCV feed is injected -->
        <img src="{{ url_for('video_feed') }}" alt="Camera Feed Loading...">
    </div>

    <div class="footer">
        SECURE CONNECTION ESTABLISHED
    </div>

</body>
</html>
